    (function () {
      const F = 1 / 30;
      function bezier(x1, y1, x2, y2) {
        return function (t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          let lo = 0, hi = 1, s = t;
          for (let i = 0; i < 30; i++) {
            s = (lo + hi) / 2;
            const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;

          return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
        };
