  <script>
    (function () {
      const F = 1 / 30;
      function bezier(x1, y1, x2, y2) {
        return function (t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          let lo = 0, hi = 1, s = t;
          for (let i = 0; i < 30; i++) {
            s = (lo + hi) / 2;
            const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;
            if (x < t) lo = s; else hi = s;
          }
          return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
        };
      }
      // 가속 곡선 후보 ① exit 곡선 재사용 (docs/motion.md 1장). 끝까지 속도가 줄지 않는다 — _plan/review.md
      const accel = bezier(0.45, 0.05, 0.85, 0.15);
      const STAGGER = 6 * F, DUR_L = 18 * F;   // stagger (dur-s) · dur-l
      const DOLLY_SCALE = 1.35;                 // dolly 배율 (요청 값)

      const v = window.__hyperframes.getVariables();
      document.getElementById("pp-persp").style.perspective = v.perspective + "px";
      const amount = document.getElementById("stat-card-amount");
      const after = amount.getAttribute("data-final");
      const SECONDS = v.seconds;
      const FLIP = STAGGER;

      const tl = gsap.timeline({ paused: true });
      // 마지막 자리: FLIP 프레임에 한 번에 바뀜 (중간값 없음). 시계 하나로 매 프레임 같은 결과
      const clock = { t: 0 };
      function paint() { amount.textContent = clock.t >= FLIP - 1e-6 ? after : v.before; }
      paint();
      tl.fromTo(clock, { t: 0 }, { t: SECONDS, duration: SECONDS, ease: "none", onUpdate: paint }, 0);
      // dolly: 바뀐 직후부터 장면 끝까지 1 → 1.35, 끝까지 가속
      tl.fromTo("#pp-cam", { scale: 1 }, { scale: DOLLY_SCALE, duration: SECONDS - FLIP, ease: accel }, FLIP);
      // 기울기: dur-l부터 장면 끝까지 rotateX만 0 → tiltDeg (yaw · roll 없음)
      tl.fromTo("#pp-phone", { rotationX: 0 }, { rotationX: v.tiltDeg, duration: SECONDS - DUR_L, ease: accel }, DUR_L);
      window.__timelines["phone-push"] = tl;
    })();
  </script>
