<!--
  src/patterns/headline.html — 텍스트 등장 · 마스크 상승 (docs/motion.md 3장 텍스트 등장, docs/video.md 3장)
  쓰는 법: out/<영상이름>/compositions/patterns/headline.html 로 복사하고 수정하지 않는다. 장면 호스트처럼 시작 · 길이를 주고 배경보다 위에 놓는다.
    <div id="s1-headline" data-composition-id="headline" data-composition-src="compositions/patterns/headline.html"
         data-start="0" data-duration="1.966667" data-width="1920" data-height="1080"
         data-variable-values='{"text":"오늘도 하나씩, 내 실력으로","top":489,"start":0,"firstVisible":true}' style="z-index:2"></div>
  변수
    text          문장. 띄어쓰기로 단어를 나눈다
    top           줄 위쪽 y(px). 줄 높이는 102px
    start         첫 단어가 올라오기 시작하는 시점(초, 이 호스트 기준)
    firstVisible  true면 첫 단어는 처음부터 보이고 둘째 단어부터 올라옴 (첫 장면 썸네일용, 오프닝 글자)
    accent        강조할 단어(부분 문자열). 비우면 강조 없음. 문장이 다 나온 뒤 emphasis로 video-accent
    mode          "rise"(기본, 마스크 상승) · "instant"(즉시 붙이기: 단어가 stagger 간격으로 한 프레임에 나타나고, 보이는 부분이 가운데 오도록 줄이 enter로 다시 자리 잡음. blur-in 없음)
    tone          "dark"(기본, video-text · 강조 video-accent) · "light"(밝은 배경: color-text · 강조 color-primary)
    size          "headline"(기본, video-headline 84px) · "hero"(video-hero 200px, 행간 34/28)
    exit          "fade"(기본, 줄 전체 blur-out + 투명) · "spread"(단어 벌어짐: 단어마다 exit로 가운데에서 바깥쪽, 거리 spread px)
    spread        단어 벌어짐 거리(px, 장면에서 정함). 기본 120
    exitAt        퇴장 시작(초, 이 호스트 기준). 0이면 퇴장 없음. exit 동안 줄 전체가 blur-out(0→4px) + 투명
  흐림: 단어마다 enter 동안 blur-in(4px→0) (docs/motion.md 1장 Blur)
  필요한 에셋: assets/fonts/Pretendard-SemiBold.otf
  Pattern (docs/motion.md 3장 '오프닝 글자' · '텍스트 등장')
    오프닝: 영상은 글자 장면으로 시작. firstVisible:true로 첫 프레임(썸네일)부터 첫 단어가 보이고 나머지가 올라온 뒤 문장 기준으로 머문다
    기본 마스크 상승: 단어마다 마스크 아래에서 enter + blur-in, 다음 단어는 stagger, 동시 개수는 motion.md 4-3
    강조 단어: 문장이 다 나온 뒤 한 단어만 emphasis로 video-text → video-accent. 크기 · 굵기는 그대로
    즉시 붙이기: mode "instant" (launch-b 승인으로 추가)
    옵션 단어별 나타나기(제자리 투명 → 불투명 enter, 간격 stagger)는 이 조각에 아직 없다
    문장 기준으로 머문다 (motion.md 4-2)
  호스트 주의: 다른 호스트를 감싼 div와 같은 층에 둘 때는 headline 호스트도 감싸개 div 안에 넣는다 (그렇지 않으면 렌더에서만 빠짐, launch-a)
-->
<template>
  <style>
    @font-face {
      font-family: "Pretendard";
      font-weight: 600;
      src: url("assets/fonts/Pretendard-SemiBold.otf") format("opentype");
    }
    /* 토큰 (docs/video.md 3장) */
    #root {
      --video-text: #ffffff;               /* video-text */
      --video-headline-size: 84px;          /* video-headline: 화면 높이 7.8% (72–88px) */
      --video-headline-line: 102px;         /* 행간 Text/display 34/28 */
      --video-tracking-tight: -0.02em;      /* video-tracking-tight */
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #root .headline {
      position: absolute;
      left: 0;
      width: 1920px;
      margin: 0;
      font-family: "Pretendard", sans-serif;
      font-weight: 600;
      font-size: var(--video-headline-size);
      line-height: var(--video-headline-line);
      letter-spacing: var(--video-tracking-tight);
      color: var(--video-text);
      text-align: center;
      white-space: nowrap;
    }
    /* 마스크 상승: 바깥 칸이 선(마스크), 안쪽 단어가 아래에서 올라옴 */
    #root .mask { display: inline-block; overflow: hidden; vertical-align: top; }
    #root .word { display: inline-block; }
  </style>
  <div id="root" data-composition-id="headline" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"text","type":"string","label":"문장","default":"문장"},{"id":"top","type":"number","label":"줄 위쪽 y(px)","default":489},{"id":"start","type":"number","label":"시작(초)","default":0},{"id":"firstVisible","type":"boolean","label":"첫 단어 처음부터 보임","default":false},{"id":"accent","type":"string","label":"강조 단어","default":""},{"id":"exitAt","type":"number","label":"퇴장 시작(초, 0=없음)","default":0},{"id":"mode","type":"string","label":"등장 방식 (rise · instant)","default":"rise"},{"id":"tone","type":"string","label":"글자 톤 (dark · light)","default":"dark"},{"id":"size","type":"string","label":"크기 (headline · hero)","default":"headline"},{"id":"exit","type":"string","label":"퇴장 (fade · spread)","default":"fade"},{"id":"spread","type":"number","label":"벌어짐 거리(px)","default":120}]'>
    <p id="hl-line" class="headline" data-layout-allow-overflow></p>
  </div>
  <script>
    (function () {
      const F = 1 / 30;
      // docs/motion.md 1장 · 2장 토큰
      function bezier(x1, y1, x2, y2) {
        return function (t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          let lo = 0, hi = 1, s = t;
          for (let i = 0; i < 30; i++) {
            s = (lo + hi) / 2;
            const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;
            if (x < t) lo = s; else hi = s;
          }
          return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
        };
      }
      const entrance = bezier(0.15, 0.85, 0.55, 0.95);   // entrance
      const exit = bezier(0.45, 0.05, 0.85, 0.15);       // exit
      const ENTER = 13 * F, EXIT = 6 * F, EMPHASIS = 18 * F, STAGGER = 6 * F; // enter · exit · emphasis · stagger
      const BLUR_IN = 4, BLUR_OUT = 4;                    // blur-in 4px → 0 · blur-out 0 → 4px (1장 Blur)
      const VIDEO_ACCENT = "#91a4ed";                      // video-accent (docs/video.md 3장)
      const COLOR_PRIMARY = "#3759de";                     // 밝은 배경 강조 color-primary (docs/video.md 2장)

      const v = window.__hyperframes.getVariables();
      const line = document.getElementById("hl-line");
      line.style.top = v.top + "px";
      const light = v.tone === "light";
      const TEXT = light ? "#18191b" : "#ffffff";          // 밝은 배경 color-text · 어두운 배경 video-text
      const ACCENT = light ? COLOR_PRIMARY : VIDEO_ACCENT;
      line.style.color = TEXT;
      if (v.size === "hero") {
        // video-hero: 200px, 행간 Text/display 34/28
        line.style.fontSize = "200px";
        line.style.lineHeight = (200 * 34 / 28).toFixed(1) + "px";
      }
      const words = String(v.text).split(" ").filter(Boolean);
      let accentEl = null;
      const inners = words.map(function (w, i) {
        const mask = document.createElement("span");
        mask.className = "mask";
        const inner = document.createElement("span");
        inner.className = "word";
        if (v.accent && !accentEl && w.indexOf(v.accent) >= 0) {
          const k = w.indexOf(v.accent);
          inner.appendChild(document.createTextNode(w.slice(0, k)));
          accentEl = document.createElement("span");
          accentEl.textContent = v.accent;
          inner.appendChild(accentEl);
          inner.appendChild(document.createTextNode(w.slice(k + v.accent.length)));
        } else {
          inner.textContent = w;
        }
        mask.appendChild(inner);
        line.appendChild(mask);
        if (i < words.length - 1) line.appendChild(document.createTextNode(" "));
        return inner;
      });

      const tl = gsap.timeline({ paused: true });
      const rising = v.firstVisible ? inners.slice(1) : inners;
      if (v.mode === "instant") {
        // 즉시 붙이기: 단어가 stagger 간격으로 한 프레임에 나타나고, 보이는 부분이 가운데 오도록 줄이 enter로 다시 자리 잡음
        const masks = inners.map(function (el) { return el.parentNode; });
        const left0 = function () { return masks[0].offsetLeft; };
        const shown = function (k) { return masks[k].offsetLeft + masks[k].offsetWidth - left0(); };
        const full = function () { return shown(masks.length - 1); };
        const offset = function (k) { return (full() - shown(k)) / 2; };
        const first = v.firstVisible ? 1 : 0;
        inners.forEach(function (el, i) { if (i >= first) gsap.set(el, { opacity: 0 }); });
        tl.set(line, { x: function () { return offset(Math.max(0, first - 1)); } }, 0);
        rising.forEach(function (el, i) {
          const k = first + i, at = v.start + i * STAGGER;
          tl.set(el, { opacity: 1 }, at);
          if (k > 0) tl.fromTo(line, { x: function () { return offset(k - 1); } }, { x: function () { return offset(k); }, duration: ENTER, ease: entrance, immediateRender: false }, at);
        });
      } else {
        rising.forEach(function (el, i) {
          tl.fromTo(el, { yPercent: 100, filter: "blur(" + BLUR_IN + "px)" }, { yPercent: 0, filter: "blur(0px)", duration: ENTER, ease: entrance }, v.start + i * STAGGER);
        });
      }
      if (accentEl) {
        // 강조 단어: 문장이 다 나온 뒤 emphasis로 video-text → video-accent
        const done = v.start + Math.max(0, rising.length - 1) * STAGGER + ENTER;
        tl.fromTo(accentEl, { color: TEXT }, { color: ACCENT, duration: EMPHASIS, ease: entrance, immediateRender: false }, done);
      }
      if (v.exitAt > 0 && v.exit === "spread") {
        // 단어 벌어짐: 단어마다 exit, 줄 가운데에서 바깥쪽으로 spread px + 투명 + blur-out
        const masks = inners.map(function (el) { return el.parentNode; });
        tl.set(masks, { overflow: "visible" }, v.exitAt);   // 퇴장 때만 마스크를 풀어 바깥으로 나갈 수 있게
        inners.forEach(function (el) {
          const m = el.parentNode;
          const dir = function () { const c = m.offsetLeft + m.offsetWidth / 2; return c < line.offsetWidth / 2 ? -1 : 1; };
          tl.to(el, { x: function () { return dir() * (v.spread || 120); }, opacity: 0, filter: "blur(" + BLUR_OUT + "px)", duration: EXIT, ease: exit }, v.exitAt);
        });
      } else if (v.exitAt > 0) {
        // 헤드라인 퇴장: exit 동안 blur-out + 투명
        tl.fromTo(line, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(" + BLUR_OUT + "px)", duration: EXIT, ease: exit, immediateRender: false }, v.exitAt);
      }
      window.__timelines["headline"] = tl;
    })();
  </script>
</template>
